<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ことば推理ゲーム</title><style>
:root{font-family:system-ui,sans-serif;color:#173b5c;background:#edf2f4}*{box-sizing:border-box}body{margin:0}.app{max-width:960px;margin:auto;padding:16px}.panel{background:#fffdf8;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #18324b18}h1{font-size:1.35rem;margin:0}h2{font-size:1.05rem}button,input{font:inherit;border-radius:8px;padding:.65rem}button{border:0;background:#173b5c;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e7eef3;color:#173b5c}button:disabled{opacity:.5;cursor:not-allowed}input{border:1px solid #aab8c6;width:100%}.row,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions{margin-top:12px}.notice{background:#fff2be;padding:10px;border-radius:8px}.hidden{display:none}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.player{border:1px solid #d7dde5;border-radius:9px;padding:10px;background:#f8fafc}.hand{display:flex;flex-wrap:wrap;gap:7px}.card{width:106px;min-height:112px;display:grid;grid-template-columns:40px 1fr;padding:0;border:2px solid #e3c97c;background:#fff;color:#173b5c;overflow:hidden}.card span{padding:7px;writing-mode:vertical-rl;text-orientation:upright}.card .kana{background:#fff2be;font-size:1.25rem}.card .cond{background:#e5f3f3;font-size:.75rem}.card.select{outline:3px solid #0f766e}.card button{border-radius:0;padding:5px;color:#173b5c;background:transparent}.board{border-collapse:collapse;width:100%;font-size:.85rem}.board td,.board th{border:1px solid #d7dde5;padding:7px;text-align:center}.board th{background:#e9f1f7}.status{font-weight:700;color:#0f766e}.error{color:#b42318}.small{font-size:.85rem;color:#536273}
</style></head><body><main class="app"><section class="panel"><h1>ことば推理ゲーム — オンラインテスト</h1><p id="connection" class="small"></p></section><section id="home" class="panel"><h2>対戦を始める</h2><label>表示名<input id="name" maxlength="20" placeholder="例：なさる"></label><div class="actions"><button onclick="createRoom()">ルームを作成</button></div><hr><label>ルームコード<input id="roomCode" maxlength="6" placeholder="招待された6文字"></label><div class="actions"><button class="secondary" onclick="joinRoom()">ルームに参加</button></div><p id="homeError" class="error"></p></section><section id="game" class="hidden"><section class="panel"><div class="row"><b id="room"></b><span id="status" class="status"></span></div><p id="message" class="notice"></p><div id="players" class="players"></div></section><section class="panel"><h2>判定記録</h2><div id="board"></div></section><section class="panel"><h2>自分の手札</h2><div id="hand" class="hand"></div><div id="actions" class="actions"></div></section></section></main><script>
let session=JSON.parse(localStorage.getItem('kotoba-online-session')||'null'), state=null, selected={lead:null,cond:null};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function saveSession(value){session=value;localStorage.setItem('kotoba-online-session',JSON.stringify(value));history.replaceState(null,'',`?room=${value.roomId}`)}
async function request(body){const response=await fetch('/api/game',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const json=await response.json();if(!response.ok)throw Error(json.error);return json}
async function createRoom(){try{const x=await request({type:'create',name:$('name').value});saveSession(x);location.reload()}catch(e){$('homeError').textContent=e.message}}
async function joinRoom(){try{const x=await request({type:'join',roomId:$('roomCode').value.toUpperCase(),name:$('name').value});saveSession(x);location.reload()}catch(e){$('homeError').textContent=e.message}}
async function load(){if(!session)return;try{const r=await fetch(`/api/game?roomId=${encodeURIComponent(session.roomId)}&token=${encodeURIComponent(session.token)}`);state=await r.json();if(!r.ok)throw Error(state.error);$('home').classList.add('hidden');$('game').classList.remove('hidden');$('connection').textContent=state.persistent?'サーバー保存: 有効':'開発用メモリ保存中。Vercel KVを接続すると永続化される。';render()}catch(e){$('connection').textContent=e.message;localStorage.removeItem('kotoba-online-session');session=null}}
async function send(type, extra={}){try{state=await request({roomId:session.roomId,token:session.token,type,...extra});selected={lead:null,cond:null};render()}catch(e){alert(e.message);load()}}
function render(){const me=state.players.find(p=>p.own);$('room').textContent=`ルーム: ${state.id}`;$('status').textContent=state.phase==='waiting'?'参加待ち':state.phase==='setup'?'秘密単語設定':state.phase==='ended'?'終了':`${state.players[state.turn].name} の手番 ${state.turns+1}/${state.turnLimit}`;$('message').textContent=state.message;$('players').innerHTML=state.players.map(p=>`<article class="player"><b>${esc(p.name)} ${p.own?'（自分）':''}</b><p>得点: ${p.score} / 回答権: ${p.guesses}</p><p>${p.ready?`頭文字: ${esc(p.lead)}<br>条件: ${esc(p.cond)}`:'秘密単語を設定中'}</p>${p.secret?`<p>秘密の単語: <b>${esc(p.secret)}</b></p>`:''}</article>`).join('');renderBoard();renderHand(me);renderActions(me)}
function renderBoard(){if(!state.declarations.length){$('board').innerHTML='<p class="small">まだ判定はない。</p>';return}$('board').innerHTML=`<table class="board"><tr><th>プレイヤー</th>${state.declarations.map(d=>`<th>${esc(d.label)}</th>`).join('')}</tr>${state.players.map(p=>`<tr><th>${esc(p.name)}</th>${state.declarations.map((_,i)=>`<td>${p.records[i]||''}</td>`).join('')}</tr>`).join('')}</table>`}
function renderHand(me){if(!me.hand){$('hand').innerHTML='';return}$('hand').innerHTML=me.hand.map((c,i)=>`<div class="card ${(selected.lead===i||selected.cond===i)?'select':''}">${state.phase==='setup'?`<button class="kana" onclick="pick(${i},'lead')">${esc(c.kana)}</button><button class="cond" onclick="pick(${i},'cond')">${esc(c.condition)}</button>`:state.phase==='turn'&&me.own&&state.turn===state.players.indexOf(me)?`<button class="kana" onclick="send('judge',{cardIndex:${i},mode:'kana'})">${esc(c.kana)}</button><button class="cond" onclick="send('judge',{cardIndex:${i},mode:'cond'})">${esc(c.condition)}</button>`:`<span class="kana">${esc(c.kana)}</span><span class="cond">${esc(c.condition)}</span>`}</div>`).join('')}
function pick(i,kind){if((kind==='lead'&&selected.cond===i)||(kind==='cond'&&selected.lead===i))return;selected[kind]=i;render()}
function renderActions(me){let html='';if(state.phase==='waiting')html='<p>招待URLを相手へ送る: <b>'+location.href+'</b></p>';if(state.phase==='setup'&&!me.ready)html=`<input id="secret" placeholder="秘密の単語（${selected.lead===null?'頭文字を選択':'「'+me.hand[selected.lead].kana+'」で始める'}）"><button onclick="send('setup',{leadIndex:selected.lead,condIndex:selected.cond,secret:$('secret').value})" ${selected.lead===null||selected.cond===null?'disabled':''}>秘密単語を確定</button>`;if(state.phase==='judgement'&&!me.solved&&(state.selfJudge||state.turn!==state.players.indexOf(me)))html=['YES','NO','？'].map(a=>`<button onclick="send('answer',{answer:'${a}'})">${a}</button>`).join('');if(state.phase==='guess'&&state.turn===state.players.indexOf(me))html=state.players.map((p,i)=>!p.own&&!p.solved?`<button class="secondary" onclick="guess(${i},'${esc(p.name)}')">${esc(p.name)} を回答</button>`:'').join('')+'<button onclick="send(\'pass\')">回答せず終了</button>';if(state.phase==='ended')html='<p>テスト対戦は終了した。</p>';$('actions').innerHTML=html}
function guess(targetIndex,name){const word=prompt(`${name} の秘密の単語を入力`);if(word)send('guess',{targetIndex,word})}
const roomFromUrl=new URLSearchParams(location.search).get('room');if(roomFromUrl&&!session)$('roomCode').value=roomFromUrl;load();setInterval(load,1500);
</script></body></html>
