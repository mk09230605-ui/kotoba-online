<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ことば推理ゲーム</title><style>
:root{font-family:system-ui,sans-serif;color:#173b5c;background:#edf2f4}*{box-sizing:border-box}body{margin:0}.app{max-width:960px;margin:auto;padding:16px}.panel{background:#fffdf8;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #18324b18}h1{font-size:1.35rem;margin:0}h2{font-size:1.05rem}button,input,select{font:inherit;border-radius:8px;padding:.65rem}button{border:0;background:#173b5c;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e7eef3;color:#173b5c}button:disabled{opacity:.5;cursor:not-allowed}input,select{border:1px solid #aab8c6;width:100%}.row,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions{margin-top:12px}.notice{background:#fff2be;padding:10px;border-radius:8px}.hidden{display:none}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.player{border:1px solid #d7dde5;border-radius:9px;padding:10px;background:#f8fafc}.hand{display:flex;flex-wrap:wrap;gap:7px}.card{width:106px;min-height:112px;display:grid;grid-template-columns:40px 1fr;padding:0;border:2px solid #e3c97c;background:#fff;color:#173b5c;overflow:hidden}.card span{padding:7px;writing-mode:vertical-rl;text-orientation:upright}.card .kana{background:#fff2be;font-size:1.25rem}.card .cond{background:#e5f3f3;font-size:.75rem}.card button{border-radius:0;padding:5px;color:#173b5c;background:transparent;position:relative}.card.lead-selected .kana{background:#f7bf45;box-shadow:inset 0 0 0 3px #a45b00}.card.cond-selected .cond{background:#82d3cb;box-shadow:inset 0 0 0 3px #086d65}.card button.selected::after{content:'選択済';position:absolute;inset:4px;display:grid;place-items:center;background:#fff9;border:2px solid currentColor;border-radius:4px;font-size:.7rem;writing-mode:vertical-rl;text-orientation:upright}.board{border-collapse:collapse;width:100%;font-size:.85rem}.board td,.board th{border:1px solid #d7dde5;padding:7px;text-align:center}.board th{background:#e9f1f7}.status{font-weight:700;color:#0f766e}.error{color:#b42318}.small{font-size:.85rem;color:#536273}
</style></head><body><main class="app"><section class="panel"><h1>ことば推理ゲーム — オンラインテスト</h1><p id="connection" class="small"></p></section><section id="home" class="panel"><h2>対戦を始める</h2><label>表示名<input id="name" maxlength="20" placeholder="例：なさる"></label><label>プレイ人数<select id="playerCount"><option value="2">2人</option><option value="3">3人</option><option value="4">4人</option></select></label><label>セット数<select id="setCount"><option value="1">1セット</option><option value="2">2セット</option><option value="3">3セット</option><option value="4">4セット</option></select></label><label>判定方式<select id="selfJudge"><option value="true">自分も判定する</option><option value="false">自分は判定しない</option></select></label><label>文字数公開<select id="showWordLength"><option value="false">無効</option><option value="true">有効</option></select></label><label>ひらがな位置公開<select id="showHiraganaPositions"><option value="false">無効</option><option value="true">有効</option></select></label><label>不正解の回答語公開<select id="showWrongGuessWord"><option value="false">無効</option><option value="true">有効</option></select></label><label>被正解者の得点方式<select id="targetScoreMode"><option value="normal">通常（+20点）</option><option value="penalty">減点（-20点）</option></select></label><div class="actions"><button onclick="createRoom()">ルームを作成</button></div><hr><label>ルームコード<input id="roomCode" maxlength="6" placeholder="招待された6文字"></label><div class="actions"><button class="secondary" onclick="joinRoom()">ルームに参加</button></div><p id="homeError" class="error"></p></section><section id="game" class="hidden"><section class="panel"><div class="row"><b id="room"></b><span id="status" class="status"></span><span id="rules" class="small"></span></div><p id="message" class="notice"></p><div id="players" class="players"></div></section><section class="panel"><h2>判定記録</h2><div id="board"></div></section><section class="panel"><h2>自分の手札</h2><div id="hand" class="hand"></div><div id="actions" class="actions"></div></section></section></main><script>
let session=JSON.parse(localStorage.getItem('kotoba-online-session')||'null'), state=null, selected={lead:null,cond:null}, secretDraft='', answerSubmitting=false;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function saveSession(value){session=value;localStorage.setItem('kotoba-online-session',JSON.stringify(value));history.replaceState(null,'',`?room=${value.roomId}`)}
async function request(body){const response=await fetch('/api/game',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const json=await response.json();if(!response.ok)throw Error(json.error);return json}
async function createRoom(){try{const x=await request({type:'create',name:$('name').value,playerCount:Number($('playerCount').value),setCount:Number($('setCount').value),selfJudge:$('selfJudge').value==='true',showWordLength:$('showWordLength').value==='true',showHiraganaPositions:$('showHiraganaPositions').value==='true',showWrongGuessWord:$('showWrongGuessWord').value==='true',targetScoreMode:$('targetScoreMode').value});saveSession(x);location.reload()}catch(e){$('homeError').textContent=e.message}}
async function joinRoom(){try{const x=await request({type:'join',roomId:$('roomCode').value.toUpperCase(),name:$('name').value});saveSession(x);location.reload()}catch(e){$('homeError').textContent=e.message}}
async function load(){if(!session)return;try{const r=await fetch(`/api/game?roomId=${encodeURIComponent(session.roomId)}&token=${encodeURIComponent(session.token)}`);state=await r.json();if(!r.ok){const error=Error(state.error);error.status=r.status;throw error}$('home').classList.add('hidden');$('game').classList.remove('hidden');$('connection').textContent=state.persistent?'サーバー保存: 有効':'開発用メモリ保存中。Vercel KVを接続すると永続化される。';render()}catch(e){$('connection').textContent=e.message||'通信に失敗した。';if([401,403,404].includes(e.status)){localStorage.removeItem('kotoba-online-session');session=null}}}
async function send(type, extra={}){try{state=await request({roomId:session.roomId,token:session.token,type,...extra});selected={lead:null,cond:null};answerSubmitting=false;render()}catch(e){answerSubmitting=false;alert(e.message);load()}}
function render(){const active=document.activeElement,activeId=active?.id,start=active?.selectionStart,end=active?.selectionEnd,input=$('secret');if(input)secretDraft=input.value;const me=state.players.find(p=>p.own);$('room').textContent=`ルーム: ${state.id} / ${state.playerCount}人 / セット ${state.setNumber}/${state.setCount}`;$('status').textContent=state.phase==='waiting'?'参加待ち':state.phase==='setup'?'秘密単語設定':state.phase==='voting'?'投票中':state.phase==='nextSet'?'次セット待ち':state.phase==='ended'?'終了':`${state.players[state.turn].name} の手番 ${state.turns+1}/${state.turnLimit}`;$('rules').textContent=`自判定: ${state.selfJudge?'あり':'なし'} / 文字数: ${state.showWordLength?'有効':'無効'} / 位置: ${state.showHiraganaPositions?'有効':'無効'} / 不正解語: ${state.showWrongGuessWord?'公開':'非公開'} / 被正解者: ${state.targetScoreMode==='penalty'?'-20点':'+20点'}`;$('message').textContent=state.message;$('players').innerHTML=state.players.map(p=>`<article class="player"><b>${esc(p.name)} ${p.own?'（自分）':''}</b><p>得点: ${p.score} / 回答権: ${p.guesses}${state.phase==='voting'||state.phase==='nextSet'||state.phase==='ended'?` / 投票: ${p.voteCount}`:''}</p><p>${p.ready?(p.own?`頭文字: ${esc(p.lead)}<br>条件: ${esc(p.cond)}`:'秘密単語を設定済み'):'秘密単語を設定中'}</p>${p.secretMask?`<p>公開情報: <b>${esc(p.secretMask)}</b></p>`:''}${p.secret?`<p>${p.own?'秘密の単語':'公開された単語'}: <b>${esc(p.secret)}</b></p>`:''}</article>`).join('');renderBoard();renderHand(me);renderActions(me);if(activeId){const next=$(activeId);if(next){next.focus();if(typeof next.setSelectionRange==='function'&&start!==null)next.setSelectionRange(start,end)}}}
function renderBoard(){const judgements=state.declarations.length?`<table class="board"><tr><th>プレイヤー</th>${state.declarations.map(d=>`<th>${esc(d.label)}</th>`).join('')}</tr>${state.players.map(p=>`<tr><th>${esc(p.name)}</th>${state.declarations.map((_,i)=>`<td>${p.records[i]||''}</td>`).join('')}</tr>`).join('')}</table>`:'<p class="small">まだ判定はない。</p>';const wrongGuesses=state.wrongGuesses.length?`<div class="small"><b>不正解の回答</b>${state.wrongGuesses.map(g=>`<p>対象: ${esc(state.players[g.targetIndex].name)} / ${g.word?`回答語: 「${esc(g.word)}」`:'不正解'}</p>`).join('')}</div>`:'';$('board').innerHTML=judgements+wrongGuesses}
function renderHand(me){if(!me.hand){$('hand').innerHTML='';return}$('hand').innerHTML=me.hand.map((c,i)=>`<div class="card ${selected.lead===i?'lead-selected':''} ${selected.cond===i?'cond-selected':''}">${state.phase==='setup'?`<button class="kana ${selected.lead===i?'selected':''}" aria-pressed="${selected.lead===i}" aria-label="頭文字として選ぶ" onclick="pick(${i},'lead')">${esc(c.kana)}</button><button class="cond ${selected.cond===i?'selected':''}" aria-pressed="${selected.cond===i}" aria-label="条件文として選ぶ" onclick="pick(${i},'cond')">${esc(c.condition)}</button>`:state.phase==='turn'&&me.own&&state.turn===state.players.indexOf(me)?`<button class="kana" aria-label="ひらがな判定に使う" onclick="send('judge',{cardIndex:${i},mode:'kana'})">${esc(c.kana)}</button><button class="cond" aria-label="条件文判定に使う" onclick="send('judge',{cardIndex:${i},mode:'cond'})">${esc(c.condition)}</button>`:`<span class="kana">${esc(c.kana)}</span><span class="cond">${esc(c.condition)}</span>`}</div>`).join('')}
function pick(i,kind){if((kind==='lead'&&selected.cond===i)||(kind==='cond'&&selected.lead===i))return;selected[kind]=i;render()}
function renderActions(me){let html='';const myIndex=state.players.indexOf(me),hasAnswered=Boolean(state.pending?.answered[myIndex]);if(state.phase==='waiting')html='<p>招待URLを相手へ送る: <b>'+location.href+'</b></p>';if(state.phase==='setup'&&!me.ready)html=`<p class="notice">各カードは左右で別の選択肢。黄色のひらがな側を「頭文字」、水色の条件文側を「条件」としてクリックする。選択済みの側だけが濃く表示される。</p><input id="secret" value="${esc(secretDraft)}" placeholder="秘密の単語（${selected.lead===null?'頭文字を選択':'「'+me.hand[selected.lead].kana+'」で始める'}）"><button onclick="send('setup',{leadIndex:selected.lead,condIndex:selected.cond,secret:$('secret').value})" ${selected.lead===null||selected.cond===null?'disabled':''}>秘密単語を確定</button>`;if(state.phase==='judgement'&&state.pending?.mode==='cond')html=`<p class="notice">判定する条件文: <b>${esc(state.pending.card.condition)}</b></p>`;if(state.phase==='judgement'&&!me.solved&&(state.selfJudge||state.turn!==myIndex))html+=hasAnswered||answerSubmitting?'<p class="small">回答を送信済み。相手の回答を待っている。</p>':['YES','NO','？'].map(a=>`<button onclick="answer('${a}')">${a}</button>`).join('');if(state.phase==='guess'&&state.turn===myIndex)html=state.players.map((p,i)=>!p.own&&!p.solved?`<button class="secondary" onclick="guess(${i},'${esc(p.name)}')">${esc(p.name)} を回答</button>`:'').join('')+'<button onclick="send(\'pass\')">回答せず終了</button>';if(state.phase==='voting')html=state.hasVoted?'<p>投票済み。全員の投票を待っている。</p>':`<p class="notice">ほかのプレイヤーの秘密単語から、良いと思うものへ1票を投じる。</p>${state.players.map((p,i)=>!p.own?`<button class="secondary" onclick="send('vote',{targetIndex:${i}})">${esc(p.name)} の「${esc(p.secret)}」へ投票</button>`:'').join('')}`;if(state.phase==='nextSet')html='<button onclick="send(\'nextSet\')">次のセットへ</button>';if(state.phase==='ended')html='<p>テスト対戦は終了した。</p>';$('actions').innerHTML=html}
function answer(value){answerSubmitting=true;render();send('answer',{answer:value})}
function guess(targetIndex,name){const word=prompt(`${name} の秘密の単語を入力`);if(word)send('guess',{targetIndex,word})}
const roomFromUrl=new URLSearchParams(location.search).get('room');if(roomFromUrl&&!session)$('roomCode').value=roomFromUrl;load();setInterval(load,1500);
</script></body></html>
